
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ElapsedTimeTrackerAndroid_WithWidget.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          unzip -o ElapsedTimeTrackerAndroid_WithWidget.zip -d project

      - name: Fix Java and Kotlin versions
        run: |
          cd project/ElapsedTimeTrackerAndroid
          find . -name '*.gradle' -o -name '*.gradle.kts'
          sed -i 's/JVM_1_8/JVM_17/g' app/build.gradle app/build.gradle.kts 2>/dev/null || true
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle app/build.gradle.kts 2>/dev/null || true
          sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" app/build.gradle app/build.gradle.kts 2>/dev/null || true
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle app/build.gradle.kts 2>/dev/null || true
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' build.gradle build.gradle.kts 2>/dev/null || true

      - name: Build APK
        run: |
          cd project/ElapsedTimeTrackerAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elapsed-time-tracker-apk
          path: project/ElapsedTimeTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
