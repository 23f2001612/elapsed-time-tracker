
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ElapsedTimeTrackerAndroid_WithWidget.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and build APK
        run: |
          unzip ElapsedTimeTrackerAndroid_WithWidget.zip -d project
          cd project/ElapsedTimeTrackerAndroid
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: elapsed-time-tracker-apk
          path: project/ElapsedTimeTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
          
