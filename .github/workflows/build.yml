name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ElapsedTimeTrackerAndroid_WithWidget.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          unzip -o ElapsedTimeTrackerAndroid_WithWidget.zip -d project
          test -f project/ElapsedTimeTrackerAndroid/app/build.gradle.kts

      - name: Set Java and Kotlin JVM targets to 17
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/ElapsedTimeTrackerAndroid/app/build.gradle.kts")
          text = p.read_text()
          marker = "android {"
          if marker not in text:
              raise SystemExit("Could not find android block in app/build.gradle.kts")

          settings = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              text = text.replace(marker, marker + "\n" + settings, 1)

          p.write_text(text)
          print(p.read_text())
          PY

      - name: Build APK
        run: |
          cd project/ElapsedTimeTrackerAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elapsed-time-tracker-apk
          path: project/ElapsedTimeTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
