name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ElapsedTimeTrackerAndroid_WithWidget.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          unzip -o ElapsedTimeTrackerAndroid_WithWidget.zip -d project
          test -d project/ElapsedTimeTrackerAndroid

      - name: Force Java and Kotlin to target JVM 17
        shell: bash
        run: |
          cat > /tmp/force-jvm17.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }
              tasks.configureEach {
                  if (name.toLowerCase().contains('kotlin') && hasProperty('kotlinOptions')) {
                      kotlinOptions.jvmTarget = '17'
                  }
              }
          }
          EOF
          cd project/ElapsedTimeTrackerAndroid
          gradle -I /tmp/force-jvm17.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elapsed-time-tracker-apk
          path: project/ElapsedTimeTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
